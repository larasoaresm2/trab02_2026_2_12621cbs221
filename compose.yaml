# S5_20: project identifier trab02_2026_2_MATRICULA (lowercase)
name: trab02_2026_2_12621cbs221

services:
  asset-inventory:
    build: .
    image: trab02_2026_2_12621cbs221
    container_name: trab02_2026_2_12621cbs221
    # The menu waits for keyboard input: keep stdin open and give it a terminal (like docker run -it)
    stdin_open: true
    tty: true
    # Bring the container back if the program ends or the server reboots,
    # unless someone stopped it on purpose
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Rotate the screen output kept by Docker (docker compose logs)
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    volumes:
      - asset-data:/app/data

volumes:
  asset-data: